<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-label="Agent survival to the first critical failure">
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #8a8984; }
  .grid { stroke: #e6e5e0; stroke-width: 1; } .axis { stroke: #b9b8b1; stroke-width: 1; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; } .s3 { fill: #1baf7a; stroke: #1baf7a; }
  .s4 { fill: #eda100; stroke: #eda100; } .s5 { fill: #e87ba4; stroke: #e87ba4; } .s6 { fill: #008300; stroke: #008300; }
  .ok { fill: #1baf7a; } .bad { fill: #e34948; } .na { fill: none; stroke: #b9b8b1; stroke-width: 1.5; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #8f8e86; }
    .grid { stroke: #2e2e2c; } .axis { stroke: #55544f; } .ring { stroke: #1a1a19; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; } .s3 { fill: #199e70; stroke: #199e70; }
    .s4 { fill: #c98500; stroke: #c98500; } .s5 { fill: #d55181; stroke: #d55181; } .s6 { fill: #008300; stroke: #008300; }
    .ok { fill: #199e70; } .bad { fill: #e66767; }
  }
</style>
<rect class="bg" x="0" y="0" width="680" height="400" rx="8"/>
<text class="t1" x="20" y="28" font-size="15" font-weight="600">Agent survival to the first critical failure</text>
<text class="t2" x="20" y="47" font-size="12">Kaplan-Meier, one chain per arm: each curve is a single step or censored</text>
<line class="axis" x1="70" y1="320" x2="550" y2="320"/>
<line class="axis" x1="70" y1="80" x2="70" y2="320"/>
<text class="t3" x="460" y="348" font-size="11">chain position</text>
<text class="t3" x="70" y="70" font-size="11">share of chains without a critical failure</text>
<text class="t3" x="64" y="84" font-size="10" text-anchor="end">1</text>
<text class="t3" x="64" y="320" font-size="10" text-anchor="end">0</text>
<path class="s1" fill="none" stroke-width="2" d="M70 80 L550 80" style="fill:none"/>
<text class="t1" x="556" y="84" font-size="11">A fresh</text>
<path class="s2" fill="none" stroke-width="2" d="M70 78.5 L550 78.5" style="fill:none"/>
<text class="t1" x="556" y="95.5" font-size="11">B long-lived</text>
<path class="s3" fill="none" stroke-width="2" d="M70 77 L550 77" style="fill:none"/>
<text class="t1" x="556" y="107" font-size="11">C + Ordo</text>
<path class="s4" fill="none" stroke-width="2" d="M70 75.5 L550 75.5" style="fill:none"/>
<text class="t1" x="556" y="118.5" font-size="11">D full</text>
<path class="s5" fill="none" stroke-width="2" d="M70 74 L550 74" style="fill:none"/>
<text class="t1" x="556" y="130" font-size="11">E adaptive</text>
<path class="s6" fill="none" stroke-width="2" d="M70 72.5 L550 72.5" style="fill:none"/>
<text class="t1" x="556" y="141.5" font-size="11">F restarted</text>
<text class="t3" x="20" y="390" font-size="11">Critical = false completion, regression or broken build at head. One chain per arm: not an estimate of a rate.</text>
</svg>