    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; } .s3 { fill: #199e70; stroke: #199e70; }
    .s4 { fill: #c98500; stroke: #c98500; } .s5 { fill: #d55181; stroke: #d55181; } .s6 { fill: #008300; stroke: #008300; }
    .ok { fill: #199e70; } .bad { fill: #e66767; }
  }
</style>
<rect class="bg" x="0" y="0" width="640" height="300" rx="8"/>
<text class="t1" x="20" y="28" font-size="15" font-weight="600">Architectural violations at the final head</text>
<text class="t2" x="20" y="47" font-size="12">Units whose head has an archcheck DET finding (severity &gt;= 2)</text>
<line class="axis" x1="130" y1="66" x2="130" y2="250"/>
<text class="t3" x="130" y="60" font-size="11">units with a violation</text>
<text class="t1" x="122" y="86" font-size="12" text-anchor="end">A fresh</text>

<text class="t2" x="136" y="86" font-size="12">0</text>
