<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Verification cost vs escaped errors">
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #8a8984; }
  .grid { stroke: #e6e5e0; stroke-width: 1; } .axis { stroke: #b9b8b1; stroke-width: 1; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; } .s3 { fill: #1baf7a; stroke: #1baf7a; }
  .s4 { fill: #eda100; stroke: #eda100; } .s5 { fill: #e87ba4; stroke: #e87ba4; } .s6 { fill: #008300; stroke: #008300; }
  .ok { fill: #1baf7a; } .bad { fill: #e34948; } .na { fill: none; stroke: #b9b8b1; stroke-width: 1.5; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #8f8e86; }
    .grid { stroke: #2e2e2c; } .axis { stroke: #55544f; } .ring { stroke: #1a1a19; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; } .s3 { fill: #199e70; stroke: #199e70; }
    .s4 { fill: #c98500; stroke: #c98500; } .s5 { fill: #d55181; stroke: #d55181; } .s6 { fill: #008300; stroke: #008300; }
    .ok { fill: #199e70; } .bad { fill: #e66767; }
  }
</style>
<rect class="bg" x="0" y="0" width="640" height="400" rx="8"/>
<text class="t1" x="20" y="28" font-size="15" font-weight="600">Verification cost vs escaped errors</text>
<text class="t2" x="20" y="47" font-size="12">Host gate time per arm against the share of units not accepted</text>
<line class="axis" x1="70" y1="330" x2="570" y2="330"/>
<line class="axis" x1="70" y1="70" x2="70" y2="330"/>
<text class="t3" x="370" y="360" font-size="11">gate CPU seconds (host)</text>
<text class="t3" x="70" y="60" font-size="11">share of units not accepted</text>
<text class="t3" x="64" y="74" font-size="10" text-anchor="end">0.1</text>
<text class="t3" x="64" y="330" font-size="10" text-anchor="end">0</text>
<circle class="s1 ring" cx="70" cy="330" r="6"><title>A fresh: 0, 0</title></circle>
<text class="t1" x="79" y="334" font-size="12">A fresh</text>
<circle class="s2 ring" cx="70" cy="330" r="6"><title>B long-lived: 0, 0</title></circle>
<text class="t1" x="79" y="334" font-size="12">B long-lived</text>
<circle class="s3 ring" cx="70" cy="330" r="6"><title>C + Ordo: 0, 0</title></circle>
<text class="t1" x="79" y="334" font-size="12">C + Ordo</text>
<circle class="s4 ring" cx="504.8" cy="330" r="6"><title>D full: 1313.4, 0</title></circle>
<text class="t1" x="513.8" y="334" font-size="12">D full</text>
<circle class="s5 ring" cx="462.6" cy="330" r="6"><title>E adaptive: 1185.9, 0</title></circle>
<text class="t1" x="471.6" y="334" font-size="12">E adaptive</text>
<circle class="s6 ring" cx="424.4" cy="330" r="6"><title>F restarted: 1070.6, 0</title></circle>
<text class="t1" x="433.4" y="334" font-size="12">F restarted</text>
<text class="t3" x="20" y="390" font-size="11">A, B and C have no gate (0 s). Model cost of in-loop controls is in figure 1.</text>
</svg>