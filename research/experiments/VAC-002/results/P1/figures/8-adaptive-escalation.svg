<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" width="640" height="230" role="img" aria-label="Arm E: escalation tier per unit">
<style>
  svg { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; } .t3 { fill: #8a8984; }
  .grid { stroke: #e6e5e0; stroke-width: 1; } .axis { stroke: #b9b8b1; stroke-width: 1; }
  .s1 { fill: #2a78d6; stroke: #2a78d6; } .s2 { fill: #eb6834; stroke: #eb6834; } .s3 { fill: #1baf7a; stroke: #1baf7a; }
  .s4 { fill: #eda100; stroke: #eda100; } .s5 { fill: #e87ba4; stroke: #e87ba4; } .s6 { fill: #008300; stroke: #008300; }
  .ok { fill: #1baf7a; } .bad { fill: #e34948; } .na { fill: none; stroke: #b9b8b1; stroke-width: 1.5; }
  .ring { stroke: #fcfcfb; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; } .t3 { fill: #8f8e86; }
    .grid { stroke: #2e2e2c; } .axis { stroke: #55544f; } .ring { stroke: #1a1a19; }
    .s1 { fill: #3987e5; stroke: #3987e5; } .s2 { fill: #d95926; stroke: #d95926; } .s3 { fill: #199e70; stroke: #199e70; }
    .s4 { fill: #c98500; stroke: #c98500; } .s5 { fill: #d55181; stroke: #d55181; } .s6 { fill: #008300; stroke: #008300; }
    .ok { fill: #199e70; } .bad { fill: #e66767; }
  }
</style>
<rect class="bg" x="0" y="0" width="640" height="230" rx="8"/>
<text class="t1" x="20" y="28" font-size="15" font-weight="600">Arm E: escalation tier per unit</text>
<text class="t2" x="20" y="47" font-size="12">Tier chosen by the frozen policy 1.0.0 from observable signals</text>
<text class="t1" x="102" y="87" font-size="12" text-anchor="end">low</text>
<rect class="s5" x="110" y="73" width="2" height="20" rx="4"/>
<text class="t2" x="118" y="87" font-size="12">0 units, $0.00 agent cost</text>
<text class="t1" x="102" y="127" font-size="12" text-anchor="end">medium</text>
<rect class="s5" x="110" y="113" width="380" height="20" rx="4"/>
<text class="t2" x="498" y="127" font-size="12">9 units, $5.33 agent cost</text>
<text class="t1" x="102" y="167" font-size="12" text-anchor="end">high</text>
<rect class="s5" x="110" y="153" width="126.7" height="20" rx="4"/>
<text class="t2" x="244.7" y="167" font-size="12">3 units, $1.93 agent cost</text>
<text class="t3" x="20" y="220" font-size="11">Cost is the agent's cost of the units at that tier (repair turns included), not the gate's CPU time.</text>
</svg>