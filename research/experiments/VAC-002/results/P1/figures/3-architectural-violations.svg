<text class="t2" x="136" y="116" font-size="12">0</text>
<text class="t1" x="122" y="146" font-size="12" text-anchor="end">C + Ordo</text>

<text class="t2" x="136" y="146" font-size="12">0</text>
<text class="t1" x="122" y="176" font-size="12" text-anchor="end">D full</text>

<text class="t2" x="136" y="176" font-size="12">0</text>
<text class="t1" x="122" y="206" font-size="12" text-anchor="end">E adaptive</text>

<text class="t2" x="136" y="206" font-size="12">0</text>
